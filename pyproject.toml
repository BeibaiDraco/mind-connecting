[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mb"
version = "0.1.0"
description = "Coupled LLM instances and self/other source attribution (mind bridging)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and the Qwen3-4B weights (run on the rented machine)"]
