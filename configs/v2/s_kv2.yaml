# Protocol v2 S-kv2: second KV strength round (finer grid; partner-prefill scope P). ACC/CAP only.
stage: v2_s_kv2
tag: strength2
split: v2_s_kv2
n_episodes: 40
seed: 0
arms:
- {condition: C0}
- {condition: ONE, interface: kv, kv_scope: C, gain: 0.4}
- {condition: ONE, interface: kv, kv_scope: C, gain: 0.5}
- {condition: ONE, interface: kv, kv_scope: C, gain: 0.6}
- {condition: ONE, interface: kv, kv_scope: C, gain: 0.7}
- {condition: ONE, interface: kv, kv_scope: C, gain: 0.85}
- {condition: ONE, interface: kv, kv_scope: ALL, gain: 0.4}
- {condition: ONE, interface: kv, kv_scope: ALL, gain: 0.5}
- {condition: ONE, interface: kv, kv_scope: ALL, gain: 0.6}
- {condition: ONE, interface: kv, kv_scope: ALL, gain: 0.7}
- {condition: ONE, interface: kv, kv_scope: ALL, gain: 0.85}
- {condition: ONE, interface: kv, kv_scope: P, gain: 0.3}
- {condition: ONE, interface: kv, kv_scope: P, gain: 0.5}
- {condition: ONE, interface: kv, kv_scope: P, gain: 1.0}
- {condition: ONE, interface: kv, kv_scope: P, gain: 2.0}
- {condition: ONE, interface: kv, kv_scope: P, gain: 3.0}
qids: [ACC_RULE, ACC_WORD, CAP0, CAP1]
episodes_per_batch: 40
max_rows: 256
post: [select_strength]
params:
  min_acc: 5.0
  min_partner_rate: 0.3
  group_order: [ONE|kv|C|18, ONE|kv|ALL|18, ONE|kv|P|18]
